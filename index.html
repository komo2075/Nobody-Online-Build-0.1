<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nobody Online — Prototype 0.1</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"><header><div><div class="eyebrow">KINGDOM 07 · PROTOTYPE 0.1</div><h1>NOBODY ONLINE</h1></div><div class="header-right"><span class="online">● <span id="onlineCount">32</span> online</span><button id="resetBtn" class="ghost">Reset session</button></div></header><div class="layout"><nav aria-label="Game navigation"><button class="nav active" data-tab="world">◈ World</button><button class="nav" data-tab="territory">♜ Territory</button><button class="nav" data-tab="ranking">★ Rankings</button><button class="nav" data-tab="alliance">⚑ Alliances</button><div class="nav-bottom"><span>SESSION</span><strong id="sessionShort">—</strong></div></nav><main><div class="resourcebar"><div>🪵 Wood <strong id="wood">500</strong></div><div>🌾 Food <strong id="food">500</strong></div><div>◈ Gold <strong id="gold">200</strong></div><div>⚔ Power <strong id="power">500</strong></div><div>⚡ Actions <strong id="actions">5</strong></div></div><section id="view" aria-live="polite"></section></main><aside><div class="aside-title">WORLD ACTIVITY <span class="live">LIVE SIMULATION</span></div><div id="feed" class="feed"></div><div class="aside-title chat-title">WORLD CHAT</div><div id="chat" class="chat"></div><div class="chat-entry"><input id="chatInput" maxlength="140" placeholder="Message the world…"><button id="sendChat">Send</button></div><div class="export"><button id="exportBtn" class="ghost">Export event log ↓</button><small>Local prototype. Data stays in this browser unless exported.</small></div></aside></div><div id="toast" role="status" aria-live="polite"></div></div><script type="module" src="js/main.js"></script></body></html>
